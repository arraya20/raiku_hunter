name = "ryku-hunt"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# ── D1 binding ──────────────────────────────────────────────────────
# When deploying via Cloudflare Pages dashboard, configure the D1
# binding in Workers & Pages → Settings → Bindings (variable name: DB).
#
# If you prefer wrangler CLI deployment instead, uncomment the block
# below and fill in the database_id UUID:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "dragon-hunt-leaderboard"
# database_id = "YOUR-DATABASE-UUID-HERE"
